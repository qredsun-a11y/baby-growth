name: baby_nutrition
description: 1-3 岁宝宝营养喂养助手（纯本地离线）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 本地数据库：存宝宝档案、每餐记录、提醒配置
  sqflite: ^2.3.3
  path: ^1.9.0
  # 拿到 App 私有目录，用于存数据库和照片
  path_provider: ^2.1.5
  # 拍照 / 从相册选图
  image_picker: ^1.1.2
  # 本地定时提醒（不依赖网络）
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  # 日期格式化（需与 flutter_localizations 依赖的 intl 版本对齐）
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # 如需自定义图标/图片，放到 assets/ 目录后在此声明，例如：
  # assets:
  #   - assets/images/
